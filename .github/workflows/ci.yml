name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cursoragentproject-launch-strategy-8382

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Role-scoped integration tests (optional)
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.PORTAL_USER_EMAIL != '' && secrets.PORTAL_USER_PASSWORD != '' && secrets.OFFICE_USER_EMAIL != '' && secrets.OFFICE_USER_PASSWORD != '' && secrets.DRIVER_USER_EMAIL != '' && secrets.DRIVER_USER_PASSWORD != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PORTAL_USER_EMAIL: ${{ secrets.PORTAL_USER_EMAIL }}
          PORTAL_USER_PASSWORD: ${{ secrets.PORTAL_USER_PASSWORD }}
          OFFICE_USER_EMAIL: ${{ secrets.OFFICE_USER_EMAIL }}
          OFFICE_USER_PASSWORD: ${{ secrets.OFFICE_USER_PASSWORD }}
          DRIVER_USER_EMAIL: ${{ secrets.DRIVER_USER_EMAIL }}
          DRIVER_USER_PASSWORD: ${{ secrets.DRIVER_USER_PASSWORD }}
          EXPECTED_PORTAL_CLIENT_ID: ${{ secrets.EXPECTED_PORTAL_CLIENT_ID }}
          EXPECTED_DRIVER_USER_ID: ${{ secrets.EXPECTED_DRIVER_USER_ID }}
        run: npm run test -- src/test/role-scope.integration.test.ts

      - name: RLS scope smoke script (optional)
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.PORTAL_USER_EMAIL != '' && secrets.PORTAL_USER_PASSWORD != '' && secrets.OFFICE_USER_EMAIL != '' && secrets.OFFICE_USER_PASSWORD != '' && secrets.DRIVER_USER_EMAIL != '' && secrets.DRIVER_USER_PASSWORD != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PORTAL_USER_EMAIL: ${{ secrets.PORTAL_USER_EMAIL }}
          PORTAL_USER_PASSWORD: ${{ secrets.PORTAL_USER_PASSWORD }}
          OFFICE_USER_EMAIL: ${{ secrets.OFFICE_USER_EMAIL }}
          OFFICE_USER_PASSWORD: ${{ secrets.OFFICE_USER_PASSWORD }}
          DRIVER_USER_EMAIL: ${{ secrets.DRIVER_USER_EMAIL }}
          DRIVER_USER_PASSWORD: ${{ secrets.DRIVER_USER_PASSWORD }}
          EXPECTED_PORTAL_CLIENT_ID: ${{ secrets.EXPECTED_PORTAL_CLIENT_ID }}
          EXPECTED_DRIVER_USER_ID: ${{ secrets.EXPECTED_DRIVER_USER_ID }}
        run: ./scripts/rls-scope-smoke-test.sh
