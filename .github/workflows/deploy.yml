name: Deploy to DreamHost

on:
  push:
    branches:
      - main
      - claude/**

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to DreamHost via rsync
        env:
          SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.DREAMHOST_SSH_PASSWORD }}
          REMOTE_PATH: ${{ secrets.DREAMHOST_REMOTE_PATH }}
        run: |
          sudo apt-get install -y -qq sshpass

          # Deploy dist/ contents to DreamHost
          sshpass -p "$SSH_PASSWORD" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"
