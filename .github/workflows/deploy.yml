name: Deploy to DreamHost

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
      - claude/**

  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to DreamHost via rsync
        env:
          SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          SSH_PASSWORD: ${{ secrets.DREAMHOST_SSH_PASSWORD }}
          REMOTE_PATH: ${{ secrets.DREAMHOST_REMOTE_PATH }}
        run: |
          sudo apt-get install -y -qq sshpass

          # Deploy dist/ contents to DreamHost
          sshpass -p "$SSH_PASSWORD" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH}/"
